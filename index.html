<script>
  // Prima del primo fotogramma: dice al CSS che JS c'è (i blocchi partono
  // nascosti e si stampano quando entrano in vista) e se l'utente vuole
  // meno animazioni (tutto immediato, niente macchina da scrivere).
  document.documentElement.classList.add("js");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("istantaneo");
  }
</script>

<div id="terminale">
  <h1 class="fuori-schermo">Portfolio di Niccolò Sabato</h1>

  <!-- Le sezioni (whoami, progetti, analisi, cv, contatti) le costruisce
       js/render.js a partire dai file in data/ -->
  <main id="contenuto"></main>

  <footer id="fine" class="blocco">
    <div class="righe">
      <p class="riga-comando">
        <span class="prompt"><b>sabato</b>@<b>portfolio</b>:<span class="perc">~</span>$</span>
        <span class="cursore" aria-hidden="true"></span>
      </p>
    </div>
  </footer>

  <noscript>

      Questo sito ha bisogno di JavaScript: i contenuti vengono costruiti
      all'apertura a partire dai file in <code>data/</code>.

</div>

<script type="module" src="js/main.js"></script>
