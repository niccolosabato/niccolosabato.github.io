<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabato Portfolio</title>
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/screen.css">
</head>
<body>

<div class="deck" id="console">

  <!-- Labbro superiore: interruttore, solco orizzontale e i due solchi
       verticali vicino agli angoli. -->
  <div class="lip">
    <button class="power" id="power" type="button" aria-label="Accensione">
      <span class="power-rail"><span class="power-knob"></span></span>
      <span class="power-plate">&#9668;OFF<span>&#9679;</span>ON&#9658;</span>
    </button>
    <i class="lip-seam" aria-hidden="true"></i>
    <i class="lip-notch l" aria-hidden="true"></i>
    <i class="lip-notch r" aria-hidden="true"></i>
  </div>

  <!-- Cornice e schermo -->
  <div class="panel">
    <div class="panel-top">
      <span class="strip long"><i></i><i></i></span>
      <span class="strip short"><i></i><i></i></span>
    </div>
    <div class="panel-body">
      <div class="panel-side">
        <span class="led-dot" id="led"></span>
        <span class="led-label">BATTERY</span>
      </div>
      <div class="lcd">
        <canvas id="screen" width="240" height="216"></canvas>
      </div>
    </div>
  </div>

  <div class="brandbar">
    <div class="wordmark"><i>sabato</i><b>PORTFOLIO</b><sup>&reg;</sup></div>
  </div>

  <div class="controls">

    <!-- Croce direzionale -->
    <div class="pad-col">
      <div class="dpad">
        <span class="dpad-arm h"></span>
        <span class="dpad-arm v"></span>
        <span class="dpad-dot"></span>
        <button class="dpad-hit up"    data-btn="up"    type="button" aria-label="Su"></button>
        <button class="dpad-hit down"  data-btn="down"  type="button" aria-label="Giù"></button>
        <button class="dpad-hit left"  data-btn="left"  type="button" aria-label="Sinistra"></button>
        <button class="dpad-hit right" data-btn="right" type="button" aria-label="Destra"></button>
      </div>
    </div>

    <!-- Tasti azione -->
    <div class="ab-col">
      <div class="ab">
        <span class="ab-pad"></span>
        <button class="round b" data-btn="b" type="button" aria-label="B"></button>
        <span class="ab-label lb">B</span>
        <button class="round a" data-btn="a" type="button" aria-label="A"></button>
        <span class="ab-label la">A</span>
      </div>
    </div>

  </div>

  <div class="bottombar">
    <div class="pills">
      <span class="pill-wrap">
        <button class="pill" data-btn="select" type="button" aria-label="Select"></button>
        <span class="pill-label">SELECT</span>
      </span>
      <span class="pill-wrap">
        <button class="pill" data-btn="start" type="button" aria-label="Start"></button>
        <span class="pill-label">START</span>
      </span>
    </div>
    <div class="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
