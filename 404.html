<!DOCTYPE html>
<html lang="it">
<head>
<!-- Google tag (gtag.js): un solo ID per home, analisi e 404 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4P77DPPF9D"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-4P77DPPF9D');
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata · Sabato Portfolio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0c0c'/%3E%3Ctext x='2' y='12.5' font-family='monospace' font-size='11' fill='%238ab061'%3E%26gt;_%3C/text%3E%3C/svg%3E">
<style>
  /* Foglio inline: GitHub Pages serve questa pagina sul percorso richiesto,
     anche profondo (analisi/qualcosa/), dove un css relativo non si
     troverebbe. Il monospace di sistema basta, senza caricare font. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #0c0c0c;
    color: #c9c9c2;
    font: 400 15px/1.7 "JetBrains Mono", ui-monospace, "Cascadia Mono",
          Menlo, Consolas, monospace;
  }
  main { width: 100%; max-width: 46rem; }
  p { margin: 0 0 0.35rem; }
  .prompt { color: #7d7d74; }
  .prompt b { color: #e9e9e2; font-weight: 500; }
  .errore { color: #e9e9e2; }
  .commento { color: #7d7d74; }
  a { color: #8ab061; text-decoration: none; font-weight: 500; }
  a:hover {
    color: #a1c86d;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  a:focus-visible {
    outline: 1px solid #8ab061;
    outline-offset: 3px;
    border-radius: 1px;
  }
  ::selection { background: #8ab061; color: #0c0c0c; }
  .cursore {
    display: inline-block;
    width: 0.62em;
    height: 1.15em;
    background: #8ab061;
    vertical-align: -0.15em;
    animation: lampeggio 1.15s steps(1) infinite;
  }
  @keyframes lampeggio { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cursore { animation: none; }
  }
</style>
</head>
<body>
<main>
  <p>
    <span class="prompt"><b>sabato</b>@<b>portfolio</b>:~$</span>
    <span class="errore">cd <span id="percorso">/</span></span>
  </p>
  <p class="errore">cd: <span id="ripetuto">/</span>: No such file or directory</p>
  <p class="commento"># la pagina non esiste, o ha cambiato indirizzo</p>
  <p>
    <a id="torna" href="/">cd ~</a>
    <span class="commento"># torna alla home</span>
    <span class="cursore" aria-hidden="true"></span>
  </p>
</main>
<script>
  // La 404 viene servita sul percorso richiesto e il testo mostra dove si è
  // arrivati; il link alla home punta alla radice, dove il sito vive.
  var percorso = decodeURIComponent(location.pathname);
  document.getElementById("percorso").textContent = percorso;
  document.getElementById("ripetuto").textContent = percorso;
  document.getElementById("torna").href = "/";
</script>
</body>
</html>
